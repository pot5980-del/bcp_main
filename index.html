<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Design System Workspace</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --sidebar-bg: #1e1e2f;
            --text-main: #ffffff;
            --text-muted: #a0a0b0;
            --hover-color: #32324e;
            --active-color: #4CAF50;
            --memo-bg: #2d2d44;
            --memo-accent: #ffd43b;
            --badge-bg: #ff6b6b; /* 뱃지 배경색 */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { display: flex; height: 100vh; font-family: 'Pretendard', sans-serif; overflow: hidden; }

        /* 사이드바 */
        .sidebar { 
            width: 320px; 
            background-color: var(--sidebar-bg); 
            color: var(--text-main); 
            display: flex; 
            flex-direction: column; 
            height: 100vh;
            z-index: 10;
            border-right: 1px solid rgba(255,255,255,0.05);
        }

        /* 메모 영역 */
        .memo-area {
            flex-shrink: 0; 
            height: 220px;  
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
        }

        .memo-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            color: var(--memo-accent);
            font-weight: bold;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .memo-content {
            font-size: 1.05rem;
            line-height: 1.7;
            color: #e0e0e0;
            word-break: keep-all;
            white-space: pre-wrap;
            overflow-y: auto; 
            flex: 1; 
        }

        /* 네비게이션 영역 */
        .nav-container {
            flex: 1; 
            padding: 25px 15px;
            overflow-y: auto; 
        }

        .nav-container h2 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 15px;
            padding-left: 5px;
            border-left: 3px solid var(--active-color); 
            line-height: 1;
        }

        .nav-list { display: flex; flex-direction: column; gap: 8px; }
        
        /* 버튼 내 텍스트와 뱃지를 양쪽 정렬하기 위해 flex 적용 */
        .nav-item { 
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px; 
            background: transparent; 
            color: var(--text-main); 
            border: none; 
            text-align: left; 
            cursor: pointer; 
            border-radius: 8px; 
            transition: 0.2s; 
            font-size: 0.95rem;
        }
        .nav-item:hover { background-color: var(--hover-color); }
        .nav-item.active { 
            background-color: var(--active-color); 
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
        }

        /* 뱃지 스타일 */
        .badge {
            background-color: var(--badge-bg);
            color: #fff;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 12px;
            letter-spacing: 0.5px;
        }

        /* 메뉴가 활성화되었을 때 뱃지 가시성 확보 */
        .nav-item.active .badge {
            background-color: #fff;
            color: var(--active-color);
        }

        /* 메인 컨텐츠 */
        .content { flex: 1; position: relative; background: #fff; }
        iframe { width: 100%; height: 100%; border: none; }

        .memo-content::-webkit-scrollbar,
        .nav-container::-webkit-scrollbar { width: 4px; }
        .memo-content::-webkit-scrollbar-thumb,
        .nav-container::-webkit-scrollbar-thumb { background: var(--hover-color); border-radius: 10px; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-3px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="memo-area" id="memoArea">
            <div class="memo-header">
                <span>💡</span> 화면 설명
            </div>
            <div id="memoText" class="memo-content">파일을 선택하면 기획 내용이 이곳에 표시됩니다.</div>
        </div>

        <div class="nav-container">
            <h2>Pages List</h2>
            <div class="nav-list" id="navList"></div>
        </div>
    </aside>

    <main class="content">
        <iframe id="viewer" src="about:blank" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
    </main>

    <script>
        const htmlFiles = [
            { id: 1, title: "[A안] 게시판 통합형", path: "A안_경제지표.html", description: "A안은 게시판이 하나의 영역에서 탭으로 구분됩니다. 개인별로 즐겨찾기한 보고서를 메인 페이지에서 바로 연결되도록 버튼을 배치하고, 주간 일정이 없는 사용자를 대비해 경제 지표 컨텐츠를 추가했습니다." },
            { id: 2, title: "[B안] 게시판 분할형", path: "B안_경제지표.html", description: "B안은 게시판별로 영역을 나눴습니다. 그 외의 컨텐츠는 A안과 동일합니다." },            
            // 데이터 속성에 badge 필드 추가
            { id: 3, title: "[A안] 주간일정O", badge: "추천", path: "A안_주간일정O.html", description: "이번 주 일정은 일일업무 혹은 회의실에 주관자/참석자로 등록되어 있는 일정을 보여줍니다." },
			{ id: 4, title: "[A안] 주간일정X", path: "A안_주간일정X.html", description: "이번 주 일정이 없는 경우 화면입니다." },
            { id: 5, title: "[B안] 주간일정O", path: "B안_주간일정O.html", description: "이번 주 일정은 일일업무 혹은 회의실에 주관자/참석자로 등록되어 있는 일정을 보여줍니다." },
			{ id: 6, title: "[B안] 주간일정X", path: "B안_주간일정X.html", description: "이번 주 일정이 없는 경우 화면입니다." },
			{ id: 7, title: "[참고] 초안", path: "old_claude.html", description: "초기 구성한 화면입니다." },
			{ id: 8, title: "[참고] 회의실예약 중심", path: "page0.html", description: "BCP에 접속해서 주로 사용하는 기능을 메인 화면에 배치해 보았습니다." },
        ];

        const navList = document.getElementById('navList');
        const viewer = document.getElementById('viewer');
        const memoText = document.getElementById('memoText');

        function loadContent(file, activeButton) {
            viewer.src = file.path;
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            activeButton.classList.add('active');

            if (file.description) {
                memoText.textContent = file.description;
            } else {
                memoText.textContent = "기획 의도가 등록되지 않은 페이지입니다.";
            }
            
            memoText.style.animation = 'none';
            memoText.offsetHeight; 
            memoText.style.animation = 'fadeIn 0.4s ease-out';
        }

        function initializeApp() {
            if (htmlFiles.length === 0) return;
            htmlFiles.forEach((file, index) => {
                const btn = document.createElement('button');
                btn.className = 'nav-item';
                
                // 타이틀 텍스트 추가
                const titleSpan = document.createElement('span');
                titleSpan.textContent = file.title;
                btn.appendChild(titleSpan);

                // badge 속성이 있는 경우 뱃지 DOM 추가
                if (file.badge) {
                    const badgeSpan = document.createElement('span');
                    badgeSpan.className = 'badge';
                    badgeSpan.textContent = file.badge;
                    btn.appendChild(badgeSpan);
                }

                btn.onclick = () => loadContent(file, btn);
                navList.appendChild(btn);
                if (index === 0) loadContent(file, btn);
            });
        }

        document.addEventListener('DOMContentLoaded', initializeApp);
    </script>
</body>
</html>
